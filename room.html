<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        textarea {
            width: 100%;
            margin-bottom: 10px;
        }
        input[type="text"] {
            width: calc(100% - 90px);
            padding: 8px;
        }
        input[type="button"] {
            width: 80px;
            padding: 8px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
        input[type="button"]:hover {
            background-color: #0056b3;
        }
        .message {
            margin-bottom: 10px;
        }
        .message.seen {
            color: #888;
        }
        .message.seen::after {
            content: " ✓";
            color: green;
        }
    </style>
</head>
<body>
    <textarea id="chat-log" cols="100" rows="20" readonly placeholder="Chat messages will appear here..."></textarea><br>
    <input id="chat-message-input" type="text" placeholder="Type your message">
    <input id="chat-message-submit" type="button" value="Send">

    <script>
        // Define roomName and username manually or use URL parameters
        const roomName = prompt("Enter the room name:", "bc7a18b1cf6c11efb395005056a73d77");
        const username = prompt("Enter your username:", "5345345");

        // Check if inputs are valid
        if (!roomName || !username) {
            alert("Both room name and username are required!");
            throw new Error("Room name or username missing.");
        }

        // Establish WebSocket connection
        const chatSocket = new WebSocket(
            `ws://151.232.36.49:8000/ws/chat/${roomName}/${username}/`
        );

        // Handle incoming messages
        chatSocket.onmessage = function(e) {
            const data = JSON.parse(e.data);
            console.log(data);
            const chatLog = document.querySelector('#chat-log');

            // Handle "seen" updates
            if (data.action === "seen") {
                // Find the message in the chat log and mark it as seen
                const messageId = data.message_id;
                const messages = chatLog.value.split('\n');
                for (let i = 0; i < messages.length; i++) {
                    if (messages[i].includes(messageId)) {
                        messages[i] = messages[i].replace(/(.*)/, "$1 ✓");
                        break;
                    }
                }
                chatLog.value = messages.join('\n');
            } else {
                // Append the new message to the chat log
                const messageLine = `${data.username}: ${data.message} ${data.date_time} -- ${data.msg_type} [ID: ${data.message_id}]`;
                chatLog.value += `${messageLine}\n`;

                // If this is the other user's message, mark it as seen
                if (data.username !== username) {
                    console.log(JSON.stringify({
                        action: "seen",
                        message_id: data.message_id
                    }));
                    chatSocket.send(JSON.stringify({
                        action: "seen",
                        message_id: data.message_id
                    }));
                }
            }

            // Scroll to the bottom of the chat log
            chatLog.scrollTop = chatLog.scrollHeight;
        };

        // Handle WebSocket close events
        chatSocket.onclose = function() {
            console.error('Chat socket closed unexpectedly');
        };

        // Focus on the message input initially
        document.querySelector('#chat-message-input').focus();

        // Send message on Enter key press
        document.querySelector('#chat-message-input').onkeyup = function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#chat-message-submit').click();
            }
        };

        // Send message on button click
        document.querySelector('#chat-message-submit').onclick = function() {
            const messageInputDom = document.querySelector('#chat-message-input');
            const message = messageInputDom.value.trim();

            if (message) {
                chatSocket.send(JSON.stringify({
                    'message': message,
                    'username': username,
                    'msg_type': "msg"
                }));
                messageInputDom.value = '';
            }
        };
    </script>
</body>
</html>
